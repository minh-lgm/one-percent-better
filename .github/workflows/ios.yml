# iOS build on GitHub's macOS runner (ARCHITECTURE §5.14, ADR-38). The development machine is Windows, so
# everything that needs Xcode runs here only. M12: lane `simulator` (unsigned build for the iOS Simulator,
# proves the Xcode project and the Capacitor sync are sound). M13: lane `testflight` (Release archive, signed with
# the App Store Connect API key — Xcode cloud-managed certificates — and uploaded to App Store Connect; manual
# signing with a .p12 + profile as the fallback, TASKS U17b). Nothing here deploys GitHub Pages (pages.yml is
# untouched). Secrets are only ever read into environment variables of single steps and written to $RUNNER_TEMP
# with mode 600; nothing prints them and no artifact is uploaded (NFR-22).
name: iOS

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'What to build'
        type: choice
        options: [simulator, testflight]
        default: simulator
      marketing_version:
        description: 'Override MARKETING_VERSION for the testflight lane (X.Y.Z; default: ios/ci/version.json)'
        type: string
        required: false
  push:
    tags: ['ios-v*']

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}-${{ inputs.lane || 'tag' }}
  cancel-in-progress: false

jobs:
  simulator:
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'simulator'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Select Xcode 26
        # Apple accepts uploads built with Xcode 26 only (from 2026-04-28); the simulator lane uses the same toolchain
        # so a build that passes here is representative. If the default is older, switch to the newest Xcode 26 on the image.
        run: |
          echo "Default: $(xcodebuild -version | head -1)"
          if ! xcodebuild -version | grep -q '^Xcode 26\.'; then
            candidate=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
            if [ -z "$candidate" ]; then
              echo "::error::No Xcode 26.x on this runner image"; exit 1
            fi
            sudo xcode-select -s "$candidate"
          fi
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 26\.'

      - name: Build the web assets for the app
        # No cloud configuration on this lane: the simulator build runs with the account feature off (FR-38).
        run: npm run build:native

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Build for the iOS Simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E '^(\*\*|error:|warning:|Build settings|=== BUILD)' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/xcodebuild.log"

      - name: Summary
        run: |
          {
            echo "## iOS simulator build"
            echo
            echo "- $(xcodebuild -version | tr '\n' ' ')"
            echo "- Capacitor $(npx cap --version)"
            echo "- Web assets: $(du -sh dist-native | cut -f1)"
            echo "- Result: $(grep -o '\*\* BUILD [A-Z]* \*\*' "$RUNNER_TEMP/xcodebuild.log" | tail -1)"
          } >> "$GITHUB_STEP_SUMMARY"

  testflight:
    # Only the real repository can sign and upload (forks have no secrets); either Run workflow with lane=testflight
    # or a pushed tag ios-vX.Y.Z (the tag sets MARKETING_VERSION).
    if: github.repository == 'minh-lgm/one-percent-better' && ((github.event_name == 'workflow_dispatch' && inputs.lane == 'testflight') || startsWith(github.ref, 'refs/tags/ios-v'))
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: ios-release
      cancel-in-progress: false
    env:
      # Build-time configuration of the web bundle (public values; the publishable key is protected by RLS).
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.VITE_GOOGLE_WEB_CLIENT_ID }}
      VITE_GOOGLE_IOS_CLIENT_ID: ${{ vars.VITE_GOOGLE_IOS_CLIENT_ID }}
      # Fallback signing (U17b) switches on when the certificate secret exists. `secrets` is not available in
      # step `if`, so the comparison is made here and the steps test the resulting env value.
      MANUAL_SIGNING: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Check release secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set (TASKS U14/U17/U18)"; missing=1; fi
          done
          [ "$missing" -eq 0 ]
          echo "Manual signing fallback: $MANUAL_SIGNING"

      - name: Select Xcode 26
        run: |
          echo "Default: $(xcodebuild -version | head -1)"
          if ! xcodebuild -version | grep -q '^Xcode 26\.'; then
            candidate=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
            if [ -z "$candidate" ]; then
              echo "::error::No Xcode 26.x on this runner image (Apple rejects uploads built with older Xcode)"; exit 1
            fi
            sudo xcode-select -s "$candidate"
          fi
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 26\.'

      - name: Build the web assets for the app
        run: npm run build:native

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Version and build number
        env:
          INPUT_MARKETING_VERSION: ${{ inputs.marketing_version }}
          IOS_BUILD_OFFSET: ${{ vars.IOS_BUILD_OFFSET }}
        run: node scripts/ios-version.mjs

      - name: Write the App Store Connect API key
        # base64 secret → $RUNNER_TEMP/AuthKey.p8 (mode 600). Validated with openssl without printing anything.
        env:
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          openssl pkey -in "$RUNNER_TEMP/AuthKey.p8" -noout || { echo "::error::APP_STORE_CONNECT_API_KEY_P8_BASE64 is not a base64-encoded .p8 private key"; exit 1; }

      - name: Import the distribution certificate and profile (manual signing fallback, U17b)
        if: env.MANUAL_SIGNING == 'true'
        env:
          P12_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          PROFILE_NAME: ${{ vars.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          umask 077
          [ -n "$PROFILE_B64" ] || { echo "::error::IOS_PROVISIONING_PROFILE_BASE64 is required with IOS_DIST_CERT_P12_BASE64"; exit 1; }
          [ -n "$PROFILE_NAME" ] || { echo "::error::Variable IOS_PROVISIONING_PROFILE_NAME is required for manual signing"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/ios-release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild > /dev/null
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(plutil -extract UUID raw -o - "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILES/$PROFILE_UUID.mobileprovision"
          echo "IOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_PATH=$PROFILES/$PROFILE_UUID.mobileprovision" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed profile $PROFILE_UUID ($PROFILE_NAME)"

      - name: Archive (Release, signed)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          GOOGLE_IOS_URL_SCHEME: ${{ vars.GOOGLE_IOS_URL_SCHEME }}
        run: |
          set -o pipefail
          signing=(CODE_SIGN_STYLE=Automatic)
          if [ "$MANUAL_SIGNING" = "true" ]; then
            signing=(CODE_SIGN_STYLE=Manual "CODE_SIGN_IDENTITY=Apple Distribution" "PROVISIONING_PROFILE_SPECIFIER=$IOS_PROFILE_NAME")
          fi
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            GOOGLE_IOS_URL_SCHEME="${GOOGLE_IOS_URL_SCHEME:-com.googleusercontent.apps.placeholder}" \
            "${signing[@]}" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E '^(\*\*|error:|warning:|=== )' || true
          grep -q '\*\* ARCHIVE SUCCEEDED \*\*' "$RUNNER_TEMP/archive.log"

      - name: Export and upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -o pipefail
          if [ "$MANUAL_SIGNING" = "true" ]; then
            plutil -replace teamID -string "$APPLE_TEAM_ID" -o "$RUNNER_TEMP/ExportOptions.plist" ios/ci/ExportOptions-manual.plist
            plutil -replace provisioningProfiles -json "{\"io.github.minhlgm.onepercentbetter\":\"$IOS_PROFILE_NAME\"}" "$RUNNER_TEMP/ExportOptions.plist"
          else
            plutil -replace teamID -string "$APPLE_TEAM_ID" -o "$RUNNER_TEMP/ExportOptions.plist" ios/ci/ExportOptions.plist
          fi
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            | tee "$RUNNER_TEMP/export.log" | grep -E '^(\*\*|error:|warning:|Upload|Export)' || true
          grep -q '\*\* EXPORT SUCCEEDED \*\*' "$RUNNER_TEMP/export.log"

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
          rm -rf "$RUNNER_TEMP/export" "$RUNNER_TEMP/App.xcarchive"
          if [ -n "${IOS_KEYCHAIN:-}" ] && [ -f "$IOS_KEYCHAIN" ]; then security delete-keychain "$IOS_KEYCHAIN" || true; fi
          if [ -n "${IOS_PROFILE_PATH:-}" ]; then rm -f "$IOS_PROFILE_PATH"; fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## iOS TestFlight upload"
            echo
            echo "- $(xcodebuild -version | tr '\n' ' ')"
            echo "- Version: ${MARKETING_VERSION:-?} (build ${BUILD_NUMBER:-?})"
            echo "- Signing: $([ "$MANUAL_SIGNING" = "true" ] && echo 'manual (.p12 + profile)' || echo 'automatic (App Store Connect API key)')"
            echo "- Archive: $(grep -o '\*\* ARCHIVE [A-Z]* \*\*' "$RUNNER_TEMP/archive.log" 2>/dev/null | tail -1)"
            echo "- Export/upload: $(grep -o '\*\* EXPORT [A-Z]* \*\*' "$RUNNER_TEMP/export.log" 2>/dev/null | tail -1)"
            echo "- Next: App Store Connect → TestFlight → wait for processing, then add the build to the internal group (TASKS U19)."
          } >> "$GITHUB_STEP_SUMMARY"
